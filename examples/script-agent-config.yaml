log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: script-agent.log

apps:
  - name: script-agent-app
    app_base_path: .
    app_module: sam_script_agent.app
    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

    app_config:
      namespace: ${NAMESPACE, default}
      agent_name: "ScriptItemProcessor"
      display_name: "Script Item Processor"

      script:
        component_module: "user_scripts.normalize_items"
        component_base_path: "."
        function_name: "run"
        input_mode: "smart"
        execution_timeout_seconds: 120
        auto_save_structured_output: true

      input_schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: string
          item:
            type: string
          text:
            type: string
          operation:
            type: string
            enum: [normalize, uppercase, length]
        additionalProperties: true

      output_schema:
        type: object
        properties:
          processed_items:
            type: array
            items:
              type: string
          processed_item: {}
          operation:
            type: string
          count:
            type: integer
        additionalProperties: true

      session_service:
        type: sql
        database_url: ${DATABASE_URL}
        default_behavior: PERSISTENT

      artifact_service:
        type: ${ARTIFACT_SERVICE_TYPE, s3}
        bucket_name: ${S3_BUCKET_NAME}
        endpoint_url: ${S3_ENDPOINT_URL}
        region: ${AWS_REGION, us-east-1}
        artifact_scope: namespace

      agent_card:
        description: "Pure Python script agent with no LLM dependency."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text", "file"]
        skills:
          - id: "process_items"
            name: "Process Items"
            description: "Normalizes a list of items or transforms a single item."
            tags: ["script", "deterministic", "no-llm"]

      agent_card_publishing:
        interval_seconds: 10
