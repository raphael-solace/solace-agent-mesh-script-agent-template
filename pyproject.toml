[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-script-agent"
version = "0.1.0"
description = "Pure-Python script-backed agents for Solace Agent Mesh"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Raphael Caillon" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
